<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تشخيص النظام — Antika</title>
  <style>
    body { font-family: 'Cairo', sans-serif; background: #0F0D0A; color: #F0EAD8; padding: 2rem; max-width: 700px; margin: 0 auto; line-height: 1.8; }
    h1 { color: #C9A84C; font-size: 1.4rem; margin-bottom: 1.5rem; }
    .check { background: #1A1612; border: 1px solid #3A3020; border-radius: 10px; padding: 1rem 1.25rem; margin-bottom: .75rem; display: flex; align-items: flex-start; gap: .75rem; }
    .icon { font-size: 1.2rem; flex-shrink: 0; margin-top: 2px; }
    .ok { color: #16a34a; }
    .fail { color: #dc2626; }
    .warn { color: #f59e0b; }
    .label { font-weight: 700; font-size: .95rem; margin-bottom: .25rem; }
    .detail { font-size: .82rem; color: #B8A888; }
    pre { background: #252017; padding: .75rem; border-radius: 6px; font-size: .75rem; overflow-x: auto; margin-top: .5rem; direction: ltr; text-align: left; }
    button { background: #C9A84C; color: #fff; border: none; padding: .75rem 1.5rem; border-radius: 8px; font-family: inherit; font-weight: 700; cursor: pointer; margin-bottom: 1.5rem; }
  </style>
</head>
<body>
  <h1>🔍 تشخيص سريع — صلاحيات الأدمن</h1>
  <button onclick="runDiagnostics()">إعادة الفحص</button>
  <div id="results">جاري الفحص...</div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="/js/config.js"></script>
  <script>
    function addCheck(label, ok, detail, warn) {
      const icon = warn ? '⚠️' : (ok ? '✅' : '❌');
      const cls  = warn ? 'warn' : (ok ? 'ok' : 'fail');
      document.getElementById('results').insertAdjacentHTML('beforeend', `
        <div class="check">
          <span class="icon ${cls}">${icon}</span>
          <div style="flex:1">
            <div class="label">${label}</div>
            ${detail ? `<div class="detail">${detail}</div>` : ''}
          </div>
        </div>`);
    }

    async function runDiagnostics() {
      document.getElementById('results').innerHTML = '<div style="color:#B8A888">جاري الفحص...</div>';

      // FIX: نفس الـ retry logic المستخدمة في باقي صفحات الأدمن —
      // Supabase أحياناً بياخد وقت يحمّل الـ session من localStorage
      // خصوصاً لو الصفحة اتفتحت في تاب جديد
      let { data: { session } } = await db.auth.getSession();
      if (!session) {
        await new Promise(r => setTimeout(r, 900));
        const retry = await db.auth.getSession();
        session = retry.data.session;
      }

      document.getElementById('results').innerHTML = '';

      if (!session) {
        addCheck('تسجيل الدخول', false, 'مفيش session — سجّل دخول من /admin-antika-ctrl/login.html الأول');
        return;
      }
      addCheck('تسجيل الدخول', true, `مسجل دخول بإيميل: ${session.user.email}`);

      // 2) هل الـ role = admin في الـ JWT
      const role = session.user.app_metadata?.role;
      addCheck(
        'الـ role في app_metadata',
        role === 'admin',
        role === 'admin'
          ? 'الـ role مظبوط صح: admin'
          : `الـ role الحالي: "${role || 'غير موجود'}" — لازم يكون "admin". شغّل: SELECT set_user_role('${session.user.email}', 'admin'); في SQL Editor ثم اعمل logout/login`
      );

      // 3) اختبار قراءة orders
      const { data: ordersData, error: ordersErr } = await db.from('orders').select('id').limit(1);
      addCheck(
        'قراءة جدول orders',
        !ordersErr,
        ordersErr ? `خطأ: ${ordersErr.message} (${ordersErr.code})` : `تم — عدد النتائج: ${ordersData?.length ?? 0}`
      );

      // 4) اختبار قراءة orders مع profiles (الـ join المستخدم في orders.html)
      const { data: joinData, error: joinErr } = await db.from('orders').select('*,profiles(full_name,phone)').limit(1);
      addCheck(
        'قراءة orders + profiles (join)',
        !joinErr,
        joinErr ? `خطأ: ${joinErr.message} (${joinErr.code}) — ده بالظبط اللي بيسبب مشكلة صفحة الطلبات` : `تم بنجاح — ده اللي بتستخدمه صفحة الطلبات`
      );

      // 5) اختبار قراءة products
      const { data: prodData, error: prodErr } = await db.from('products').select('id').limit(1);
      addCheck(
        'قراءة جدول products',
        !prodErr,
        prodErr ? `خطأ: ${prodErr.message} (${prodErr.code})` : `تم — عدد النتائج: ${prodData?.length ?? 0}`
      );

      // 6) اختبار قراءة profiles
      const { data: profData, error: profErr } = await db.from('profiles').select('id').limit(1);
      addCheck(
        'قراءة جدول profiles',
        !profErr,
        profErr ? `خطأ: ${profErr.message} (${profErr.code})` : `تم — عدد النتائج: ${profData?.length ?? 0}`
      );

      // 7) اختبار get_all_users RPC
      const { data: rpcData, error: rpcErr } = await db.rpc('get_all_users');
      addCheck(
        'دالة get_all_users()',
        !rpcErr,
        rpcErr ? `خطأ: ${rpcErr.message}` : `تم — عدد المستخدمين: ${rpcData?.length ?? 0}`
      );

      // 8) اختبار settings
      const { data: setData, error: setErr } = await db.from('settings').select('key').limit(1);
      addCheck(
        'قراءة جدول settings',
        !setErr,
        setErr ? `خطأ: ${setErr.message}` : `تم`
      );

      // ملخص نهائي
      const allOk = !ordersErr && !joinErr && !prodErr && !profErr && !rpcErr && !setErr && role === 'admin';
      document.getElementById('results').insertAdjacentHTML('beforeend', `
        <div style="margin-top:1.5rem;padding:1.25rem;border-radius:10px;background:${allOk ? 'rgba(22,163,74,.1)' : 'rgba(220,38,38,.1)'};border:1px solid ${allOk ? '#16a34a' : '#dc2626'}">
          <strong>${allOk ? '✅ كل حاجة شغالة صح — النظام جاهز' : '❌ فيه مشاكل لازم تتحل قبل التسليم — راجع الأخطاء فوق'}</strong>
        </div>`);
    }

    runDiagnostics();
  </script>
</body>
</html>
