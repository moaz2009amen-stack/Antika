<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Antika Gallery — طلباتي</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/track.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <nav class="navbar" id="navbar">
    <a href="/" class="navbar-brand">Antika Gallery</a>
    <ul class="navbar-nav">
      <li><a href="/" data-ar="الرئيسية" data-en="Home">الرئيسية</a></li>
      <li><a href="/shop.html" data-ar="المتجر" data-en="Shop">المتجر</a></li>
    </ul>
    <div class="navbar-actions">
      <button class="navbar-icon-btn" onclick="toggleTheme()" id="theme-toggle"><i class="fas fa-moon"></i></button>
      <button class="navbar-icon-btn" onclick="toggleLang()" style="font-size:0.75rem;font-weight:700" id="lang-toggle">EN</button>
      <a href="/wishlist.html" class="navbar-icon-btn wishlist-hide" title="المفضلة"><i class="far fa-heart"></i></a>
      <a href="/cart.html" class="navbar-icon-btn"><i class="fas fa-shopping-bag"></i><span class="cart-count" style="display:none">0</span></a>
      <div id="user-area"></div>
    </div>
  </nav>

  <div class="container page-enter" style="padding-top:2rem">
    <div class="track-container">
      <div style="text-align:center;margin-bottom:2rem">
        <h1 style="font-family:var(--font-display);font-size:2rem;font-style:italic;margin-bottom:0.5rem" data-ar="طلباتي" data-en="My Orders">طلباتي</h1>
        <p style="color:var(--text-muted)" data-ar="كل طلباتك في مكان واحد" data-en="All your orders in one place">كل طلباتك في مكان واحد</p>
      </div>

      <!-- Success state بعد إتمام الطلب من checkout.html -->
      <div id="success-box" style="display:none">
        <div class="success-box">
          <div class="success-icon"><i class="fas fa-check-circle"></i></div>
          <h3 style="font-family:var(--font-display);font-size:1.5rem;margin-bottom:.5rem;color:#16a34a" data-ar="تم تأكيد طلبك! 🎉" data-en="Order Confirmed! 🎉">تم تأكيد طلبك! 🎉</h3>
          <p style="color:var(--text-secondary);margin-bottom:1.25rem" data-ar="هنتواصل معاكِ قريباً على التليفون" data-en="We will contact you soon by phone">هنتواصل معاكِ قريباً على التليفون</p>
          <div id="success-order-id" style="background:var(--bg-secondary);border-radius:var(--radius-sm);padding:.6rem 1.25rem;display:inline-block;margin-bottom:1.5rem">
            <div style="font-size:.75rem;color:var(--text-muted)" data-ar="رقم الطلب" data-en="Order ID">رقم الطلب</div>
            <div id="success-id-val" style="font-family:monospace;font-weight:700;color:var(--gold);font-size:1.1rem"></div>
          </div>
          <div style="display:flex;gap:.75rem;justify-content:center;flex-wrap:wrap">
            <button onclick="scrollToOrders()" class="btn btn-outline btn-sm">
              <i class="fas fa-list"></i> <span data-ar="كل طلباتي" data-en="My Orders">كل طلباتي</span>
            </button>
            <a href="/shop.html" class="btn btn-primary btn-sm">
              <i class="fas fa-shopping-bag"></i> <span data-ar="متابعة التسوق" data-en="Continue Shopping">متابعة التسوق</span>
            </a>
          </div>
        </div>
      </div>

      <!-- FIX: مفيش فورم بحث بالتليفون خالص — الطلبات بتظهر تلقائي
           حسب المستخدم المسجل دخول -->
      <div id="orders-results"></div>
    </div>
  </div>

  <footer class="footer-simple">
    <div class="container">
      <p>© 2026 Antika Gallery</p>
      <p class="footer-dev">Developed by <a href="https://www.facebook.com/profile.php?id=61552026802548&locale=ar_AR" target="_blank" rel="noopener">Moaz</a></p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <!-- FIX: jsPDF لتوليد فواتير PDF في المتصفح مباشرة -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="/js/config.js"></script>
  <script>
    const l = getLang();
    let currentUser = null;
    let invoiceSettings = {};

    function applyLang() {
      document.querySelectorAll('[data-ar]').forEach(el => {
        if (el.tagName !== 'INPUT') el.textContent = l === 'ar' ? el.dataset.ar : el.dataset.en;
      });
      document.getElementById('lang-toggle').textContent = l === 'ar' ? 'EN' : 'ع';
    }
    function toggleLang()  { setLang(l === 'ar' ? 'en' : 'ar'); }
    function toggleTheme() {
      const t = getTheme() === 'light' ? 'dark' : 'light';
      setTheme(t);
      document.getElementById('theme-toggle').innerHTML = t === 'dark' ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
    }

    function scrollToOrders() {
      document.getElementById('orders-results').scrollIntoView({ behavior: 'smooth' });
    }

    const steps = [
      { key: 'pending',    ar: 'تم استلام الطلب',  en: 'Order Received',  icon: 'fa-check' },
      { key: 'confirmed',  ar: 'تم تأكيد الطلب',   en: 'Order Confirmed', icon: 'fa-thumbs-up' },
      { key: 'processing', ar: 'جاري التجهيز',      en: 'Being Prepared',  icon: 'fa-box' },
      { key: 'shipped',    ar: 'في الطريق إليك',    en: 'On the Way',      icon: 'fa-truck' },
      { key: 'delivered',  ar: 'تم التوصيل',        en: 'Delivered',       icon: 'fa-home' }
    ];
    const statusOrder = ['pending','confirmed','processing','shipped','delivered'];

    function buildTimeline(status) {
      const currentIdx = statusOrder.indexOf(status);
      return steps.map((step, i) => {
        const isDone    = i < currentIdx || (status === 'delivered' && i <= currentIdx);
        const isCurrent = i === currentIdx && status !== 'cancelled';
        return `
          <div class="timeline-step ${isDone ? 'done' : ''} ${isCurrent ? 'current' : ''}">
            <div class="step-circle"><i class="fas ${step.icon}"></i></div>
            <div class="step-content">
              <div class="step-title" style="color:${isDone || isCurrent ? 'var(--gold)' : 'var(--text-muted)'}">
                ${l === 'ar' ? step.ar : step.en}
              </div>
              ${isCurrent ? `<div class="step-date" style="color:var(--gold)">${l === 'ar' ? 'الحالة الحالية' : 'Current Status'}</div>` : ''}
            </div>
          </div>`;
      }).join('');
    }

    // FIX: تحميل طلبات المستخدم المسجل دخول تلقائياً — مفيش بحث
    // بتليفون خالص. requireAuth() بتوجه لصفحة الدخول لو مش مسجل.
    async function loadMyOrders() {
      const container = document.getElementById('orders-results');
      container.innerHTML = `<div style="text-align:center;padding:3rem"><div class="spinner" style="margin:0 auto"></div></div>`;

      const { data: orders, error } = await db
        .from('orders')
        .select('*, order_items(quantity, price_at_time, products(name, name_ar, images))')
        .eq('user_id', currentUser.id)
        .order('created_at', { ascending: false });

      if (error) {
        container.innerHTML = `<div style="text-align:center;padding:3rem;color:var(--text-muted)">
          <i class="fas fa-exclamation-circle" style="font-size:2.5rem;display:block;margin-bottom:1rem;color:var(--border)"></i>
          <p>${l === 'ar' ? 'حصل خطأ في تحميل الطلبات' : 'Error loading orders'}</p>
        </div>`;
        return;
      }

      if (!orders?.length) {
        container.innerHTML = `<div style="text-align:center;padding:4rem 1rem;color:var(--text-muted)">
          <i class="fas fa-box-open" style="font-size:3rem;display:block;margin-bottom:1.25rem;color:var(--border)"></i>
          <p style="font-size:1rem;font-weight:600;margin-bottom:1.5rem">${l === 'ar' ? 'مفيش طلبات لحد دلوقتي' : 'No orders yet'}</p>
          <a href="/shop.html" class="btn btn-primary">${l === 'ar' ? 'ابدئي التسوق' : 'Start Shopping'}</a>
        </div>`;
        return;
      }

      renderOrders(orders);
    }

    function renderOrders(orders) {
      const statusMap = {
        pending:    { ar: 'في الانتظار', en: 'Pending',    cls: 'badge-warning' },
        confirmed:  { ar: 'مؤكد',        en: 'Confirmed',  cls: 'badge-info' },
        processing: { ar: 'قيد التجهيز', en: 'Processing', cls: 'badge-info' },
        shipped:    { ar: 'في الطريق',   en: 'Shipped',    cls: 'badge-gold' },
        delivered:  { ar: 'تم التوصيل', en: 'Delivered',  cls: 'badge-success' },
        cancelled:  { ar: 'ملغي',        en: 'Cancelled',  cls: 'badge-danger' }
      };
      const placeholder = 'https://res.cloudinary.com/df3ffyrsg/image/upload/q_auto,f_auto,w_40/v1/antika/placeholder';

      document.getElementById('orders-results').innerHTML = orders.map(order => {
        const s = statusMap[order.status] || statusMap.pending;
        return `
          <div class="order-result show" style="margin-bottom:1rem">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;flex-wrap:wrap;gap:0.5rem">
              <div>
                <div style="font-weight:700;font-family:monospace;color:var(--gold);font-size:1rem">
                  #${escapeHtml(order.id.slice(0,8).toUpperCase())}
                </div>
                <div style="font-size:0.8rem;color:var(--text-muted)">${formatDate(order.created_at)}</div>
              </div>
              <div style="display:flex;align-items:center;gap:.5rem">
                <span class="badge ${s.cls}">${l === 'ar' ? s.ar : s.en}</span>
                <!-- FIX: زر تحميل الفاتورة PDF -->
                <button class="btn btn-ghost btn-sm" onclick="downloadInvoice('${encodeURIComponent(order.id)}')" title="${l === 'ar' ? 'تحميل الفاتورة' : 'Download Invoice'}">
                  <i class="fas fa-file-pdf"></i>
                </button>
              </div>
            </div>

            ${order.status !== 'cancelled'
              ? `<div class="status-timeline">${buildTimeline(order.status)}</div>`
              : `<div style="text-align:center;padding:1rem;color:#dc2626;background:rgba(220,38,38,0.05);border-radius:var(--radius);border:1px solid rgba(220,38,38,0.2)">
                  ${l === 'ar' ? 'تم إلغاء هذا الطلب' : 'This order has been cancelled'}
                </div>`}

            <div style="border-top:1px solid var(--border);padding-top:1rem;margin-top:1rem">
              <div style="font-size:0.85rem;color:var(--text-muted);margin-bottom:0.5rem">
                ${l === 'ar' ? 'المنتجات:' : 'Products:'}
              </div>
              ${(order.order_items || []).map(oi => {
                const pname = escapeHtml(l === 'ar' && oi.products?.name_ar ? oi.products.name_ar : (oi.products?.name || '—'));
                const imgSrc = escapeHtml(oi.products?.images?.[0] || placeholder);
                return `
                  <div style="display:flex;align-items:center;gap:0.75rem;padding:0.5rem 0">
                    <img src="${imgSrc}" style="width:40px;height:50px;border-radius:4px;object-fit:cover;background:var(--bg-secondary);border:1px solid var(--border)" onerror="this.src='${placeholder}'" alt="">
                    <div style="flex:1">
                      <div style="font-size:0.9rem;font-weight:600">${pname}</div>
                      <div style="font-size:0.8rem;color:var(--text-muted)">${l === 'ar' ? 'الكمية:' : 'Qty:'} ${escapeHtml(String(oi.quantity))}</div>
                    </div>
                    <div style="font-weight:700;color:var(--gold)">${formatPrice(oi.price_at_time * oi.quantity)}</div>
                  </div>`;
              }).join('')}
              ${order.delivery_fee > 0 ? `
              <div style="display:flex;justify-content:space-between;margin-top:0.5rem;font-size:0.85rem;color:var(--text-muted)">
                <span>${l === 'ar' ? 'رسوم التوصيل' : 'Delivery Fee'}</span>
                <span>${formatPrice(order.delivery_fee)}</span>
              </div>` : ''}
              <div style="display:flex;justify-content:space-between;margin-top:0.75rem;padding-top:0.75rem;border-top:1px solid var(--border);font-weight:700">
                <span>${l === 'ar' ? 'الإجمالي' : 'Total'}</span>
                <span style="color:var(--gold)">${formatPrice(order.total)}</span>
              </div>
            </div>
          </div>`;
      }).join('');

      // FIX: خزّن الطلبات في متغير global عشان downloadInvoice تقدر توصلها
      window._myOrders = orders;
    }

    // ══════════════════════════════════════════════════════════════
    // FIX: توليد فاتورة PDF — بيانات المتجر من إعدادات لوحة التحكم
    // ══════════════════════════════════════════════════════════════
    async function downloadInvoice(encodedOrderId) {
      const orderId = decodeURIComponent(encodedOrderId);
      const order = (window._myOrders || []).find(o => o.id === orderId);
      if (!order) return;

      showToast(l === 'ar' ? 'جاري تجهيز الفاتورة...' : 'Preparing invoice...', 'info');

      const { data: profile } = await db.from('profiles')
        .select('full_name, phone, address').eq('id', currentUser.id).single();

      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ unit: 'pt', format: 'a4' });

      const pageWidth = doc.internal.pageSize.getWidth();
      const margin = 40;
      let y = 50;

      doc.setFontSize(20);
      doc.text(invoiceSettings.storeName || 'Antika Gallery', pageWidth / 2, y, { align: 'center' });
      y += 22;

      doc.setFontSize(9);
      doc.setTextColor(100);
      if (invoiceSettings.address) {
        doc.text(invoiceSettings.address, pageWidth / 2, y, { align: 'center' });
        y += 14;
      }
      const contactLine = [invoiceSettings.phone, invoiceSettings.email].filter(Boolean).join('  |  ');
      if (contactLine) {
        doc.text(contactLine, pageWidth / 2, y, { align: 'center' });
        y += 14;
      }
      if (invoiceSettings.taxNumber) {
        doc.text(`Tax No: ${invoiceSettings.taxNumber}`, pageWidth / 2, y, { align: 'center' });
        y += 14;
      }

      y += 10;
      doc.setDrawColor(201, 168, 76);
      doc.setLineWidth(1.5);
      doc.line(margin, y, pageWidth - margin, y);
      y += 30;

      doc.setTextColor(0);
      doc.setFontSize(14);
      doc.text('INVOICE', margin, y);
      doc.setFontSize(10);
      doc.text(`#${order.id.slice(0, 8).toUpperCase()}`, pageWidth - margin, y, { align: 'right' });
      y += 18;

      doc.setFontSize(9);
      doc.setTextColor(100);
      doc.text(`Date: ${new Date(order.created_at).toLocaleDateString('en-GB')}`, margin, y);
      doc.text(`Status: ${order.status}`, pageWidth - margin, y, { align: 'right' });
      y += 30;

      doc.setTextColor(0);
      doc.setFontSize(10);
      doc.text('Bill To:', margin, y);
      y += 14;
      doc.setFontSize(9);
      doc.setTextColor(80);
      doc.text(profile?.full_name || '-', margin, y); y += 12;
      doc.text(profile?.phone || '-', margin, y); y += 12;
      if (profile?.address) { doc.text(profile.address, margin, y); y += 12; }
      y += 20;

      doc.setFillColor(245, 240, 225);
      doc.rect(margin, y, pageWidth - margin * 2, 22, 'F');
      doc.setTextColor(0);
      doc.setFontSize(9);
      doc.text('Item', margin + 8, y + 15);
      doc.text('Qty', pageWidth - margin - 160, y + 15, { align: 'center' });
      doc.text('Price', pageWidth - margin - 90, y + 15, { align: 'center' });
      doc.text('Total', pageWidth - margin - 8, y + 15, { align: 'right' });
      y += 22;

      doc.setFontSize(9);
      doc.setTextColor(40);
      (order.order_items || []).forEach(item => {
        // FIX: PDF fonts افتراضياً مش بتدعم عربي — بنستخدم الاسم
        // الإنجليزي لو موجود، وإلا بنعرض اسم عام بدل حروف مشوهة
        const safeName = item.products?.name || 'Product';
        doc.text(safeName.slice(0, 40), margin + 8, y + 15);
        doc.text(String(item.quantity), pageWidth - margin - 160, y + 15, { align: 'center' });
        doc.text(String(item.price_at_time), pageWidth - margin - 90, y + 15, { align: 'center' });
        doc.text(String((item.price_at_time * item.quantity).toFixed(2)), pageWidth - margin - 8, y + 15, { align: 'right' });
        y += 20;
        doc.setDrawColor(230);
        doc.line(margin, y - 6, pageWidth - margin, y - 6);
      });

      y += 15;

      const productsTotal = order.total - (order.delivery_fee || 0);
      doc.setFontSize(9);
      doc.setTextColor(80);
      doc.text('Subtotal:', pageWidth - margin - 140, y);
      doc.text(productsTotal.toFixed(2) + ' EGP', pageWidth - margin - 8, y, { align: 'right' });
      y += 16;

      if (order.delivery_fee > 0) {
        doc.text('Delivery Fee:', pageWidth - margin - 140, y);
        doc.text(order.delivery_fee.toFixed(2) + ' EGP', pageWidth - margin - 8, y, { align: 'right' });
        y += 16;
      }

      doc.setDrawColor(201, 168, 76);
      doc.line(pageWidth - margin - 140, y, pageWidth - margin, y);
      y += 14;

      doc.setFontSize(12);
      doc.setTextColor(0);
      doc.text('Total:', pageWidth - margin - 140, y);
      doc.text(order.total.toFixed(2) + ' EGP', pageWidth - margin - 8, y, { align: 'right' });
      y += 40;

      if (invoiceSettings.footerNote) {
        doc.setFontSize(9);
        doc.setTextColor(120);
        doc.text(invoiceSettings.footerNote, pageWidth / 2, y, { align: 'center' });
      }

      doc.save(`invoice-${order.id.slice(0, 8)}.pdf`);
    }

    // ══════════════════════════════════════════════════════════════
    // Init
    // ══════════════════════════════════════════════════════════════
    async function initUserArea() {
      const area = document.getElementById('user-area');
      area.innerHTML = `<a href="/profile.html" class="btn btn-ghost btn-sm">${l === 'ar' ? 'حسابي' : 'My Account'}</a>`;
    }

    async function loadInvoiceSettings() {
      invoiceSettings = {
        storeName:  await getSetting('invoice_store_name') || 'Antika Gallery',
        address:    await getSetting('invoice_address')    || '',
        phone:      await getSetting('invoice_phone')       || '',
        email:      await getSetting('invoice_email')       || '',
        taxNumber:  await getSetting('invoice_tax_number')  || '',
        footerNote: await getSetting('invoice_footer_note') || '',
      };
    }

    (async function init() {
      checkMaintenance();
      applyLang();
      updateCartCount();
      document.getElementById('theme-toggle').innerHTML = getTheme() === 'dark' ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
      window.addEventListener('scroll', () => document.getElementById('navbar').classList.toggle('scrolled', window.scrollY > 20));

      // FIX: لازم تسجيل دخول — مفيش تتبع بدون حساب
      currentUser = await requireAuth('/auth.html?redirect=/track.html');
      if (!currentUser) return;

      await initUserArea();
      await loadInvoiceSettings();

      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('success') === '1') {
        const orderId = urlParams.get('order');
        document.getElementById('success-box').style.display = 'block';
        if (orderId) {
          document.getElementById('success-id-val').textContent =
            '#' + decodeURIComponent(orderId).slice(0,8).toUpperCase();
        } else {
          document.getElementById('success-order-id').style.display = 'none';
        }
        window.history.replaceState({}, '', '/track.html');
      }

      await loadMyOrders();
    })();
  </script>
</body>
</html>
